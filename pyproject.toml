[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antihall"
version = "3.0.0"
description = "中文金融报告幻觉检测工具包 — 双引擎（正则+LLM）提取声明，数字+语义双重核查，对接 A 股真实财报验证"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "akshare>=1.10.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/xueshulqy770323/antihall"
Repository = "https://github.com/xueshulqy770323/antihall"
Issues = "https://github.com/xueshulqy770323/antihall/issues"

[tool.setuptools.packages.find]
include = ["antihall*"]
